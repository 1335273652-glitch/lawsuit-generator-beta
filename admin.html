<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>诉状生成器 · 管理后台 0.8β</title>
  <style>
    :root{--navy:#14283d;--gold:#b78633;--ink:#17202b;--muted:#6d7785;--line:#e3e7eb;--bg:#f3f5f7;--green:#2a7a61;--red:#b34f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.top{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:1px solid #d8b36c;display:grid;place-items:center;color:#d8b36c;font-family:serif;font-size:20px}.top a{color:#dce5ee;text-decoration:none;font-size:13px}.wrap{max-width:1240px;margin:0 auto;padding:30px 24px 60px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.head h1{margin:0 0 8px;font-size:28px}.head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #cfd5dc;background:#fff;color:var(--navy);border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:700;font-size:13px}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red)}.notice{background:#fff8e9;border-left:3px solid var(--gold);padding:12px 15px;color:#72571f;font-size:13px;line-height:1.7;margin-bottom:22px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 7px 22px rgba(20,40,61,.04)}.metric{padding:20px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:29px;margin:8px 0 4px}.metric small{font-size:11px;color:var(--green)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{padding:22px}.panel h2{font-size:17px;margin:0 0 18px}.funnel-row{display:grid;grid-template-columns:110px 1fr 68px;align-items:center;gap:12px;margin:13px 0;font-size:13px}.bar{height:12px;background:#edf0f3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d5ae67);border-radius:99px}.distribution{display:grid;gap:13px}.dist-row{display:grid;grid-template-columns:1fr 54px;gap:12px;align-items:center}.dist-row b{font-size:13px}.dist-row span{text-align:right;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px}th{color:var(--muted);font-weight:600}.empty{padding:45px 10px;text-align:center;color:var(--muted);font-size:13px}.pill{display:inline-block;border-radius:99px;background:#edf5f1;color:var(--green);padding:3px 8px}.source{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}input[type=file]{display:none}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.metrics{grid-template-columns:1fr}.top{padding:0 18px}.wrap{padding:22px 14px}.funnel-row{grid-template-columns:82px 1fr 48px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">法</div><strong>运营管理后台 · 0.8β</strong></div><a href="index.html">返回用户端</a></header>
  <main class="wrap">
    <div class="head"><div><h1>测试数据看板</h1><p class="source"><i class="dot"></i><span id="sourceText">当前浏览器本地数据</span></p></div><div class="actions"><button class="btn" onclick="downloadCsv()">导出 CSV</button><button class="btn" onclick="downloadJson()">导出 JSON</button><label class="btn" for="importFile">合并测试数据</label><input id="importFile" type="file" accept="application/json,.json" onchange="importJson(event)"><button class="btn danger" onclick="clearData()">清空数据</button></div></div>
    <div class="notice">本页是埋点与后台指标验证版。当前数据只来自这台设备的浏览器；其他律师的测试数据需在其设备导出 JSON，再使用“合并测试数据”导入。正式运营版接入云端数据库后可自动汇总。</div>
    <section class="metrics" id="metrics"></section>
    <section class="grid"><div class="panel"><h2>核心转化漏斗</h2><div id="funnel"></div></div><div class="panel"><h2>案件类型分布</h2><div class="distribution" id="distribution"></div></div></section>
    <section class="grid"><div class="panel"><h2>问卷步骤完成与流失</h2><div class="table-wrap" id="steps"></div></div><div class="panel"><h2>关键行为</h2><div class="table-wrap" id="keyEvents"></div></div></section>
    <section class="panel"><h2>最近事件明细</h2><div class="table-wrap" id="events"></div></section>
  </main>
  <script src="analytics.js"></script>
  <script>
    let importedEvents=[];
    const names={app_open:'打开页面',case_start:'开始填写',step_view:'查看步骤',step_complete:'完成步骤',validation_failed:'校验未通过',preview_generated:'生成预览',paywall_view:'进入付费页',payment_test_skipped:'跳过付费',result_view:'查看完整诉状',history_view:'查看历史诉状',restart:'重新填写'};
    const caseNames={work:'工伤相关',traffic:'交通事故',premises:'公共场所',assault:'故意伤害',medical:'医疗损害',product:'产品责任',animal:'动物致害',falling:'高空坠物',labor:'提供劳务受害',school:'教育机构',other:'其他'};
    const uniq=(rows,key)=>new Set(rows.map(x=>x[key]).filter(Boolean)).size;
    const count=(rows,name)=>rows.filter(x=>x.event===name).length;
    function allEvents(){const own=AppAnalytics.events();const map=new Map([...own,...importedEvents].map(x=>[x.eventId||JSON.stringify(x),x]));return [...map.values()].sort((a,b)=>String(a.occurredAt).localeCompare(String(b.occurredAt)))}
    function percent(a,b){return b?`${Math.round(a/b*100)}%`:'0%'}
    function render(){const rows=allEvents(),opens=count(rows,'app_open'),starts=count(rows,'case_start'),previews=count(rows,'preview_generated'),results=count(rows,'result_view');document.getElementById('sourceText').textContent=importedEvents.length?`本机 + 已导入数据（${rows.length} 条事件）`:`当前浏览器本地数据（${rows.length} 条事件）`;document.getElementById('metrics').innerHTML=[['匿名访客',uniq(rows,'visitorId'),'去重设备'],['开始填写',starts,`打开后开始率 ${percent(starts,opens)}`],['生成预览',previews,`问卷完成率 ${percent(previews,starts)}`],['查看完整诉状',results,`预览转化率 ${percent(results,previews)}`]].map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');const funnel=[['打开页面','app_open'],['开始填写','case_start'],['生成预览','preview_generated'],['进入付费页','paywall_view'],['查看完整诉状','result_view']],max=Math.max(1,...funnel.map(x=>count(rows,x[1])));document.getElementById('funnel').innerHTML=funnel.map(x=>{const n=count(rows,x[1]);return `<div class="funnel-row"><span>${x[0]}</span><div class="bar"><i style="width:${n/max*100}%"></i></div><b>${n}</b></div>`}).join('');const cases={};rows.filter(x=>x.event==='case_start').forEach(x=>{const k=x.properties?.caseType||'unknown';cases[k]=(cases[k]||0)+1});document.getElementById('distribution').innerHTML=Object.keys(cases).length?Object.entries(cases).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="dist-row"><div><b>${caseNames[k]||k}</b><div class="bar" style="margin-top:7px"><i style="width:${starts?n/starts*100:0}%"></i></div></div><span>${n}</span></div>`).join(''):'<div class="empty">暂无案件数据</div>';const stepMap={};rows.filter(x=>x.event==='step_view'||x.event==='step_complete'||x.event==='validation_failed').forEach(x=>{const k=x.properties?.stepId||'未知';stepMap[k] ||= {view:0,complete:0,failed:0};if(x.event==='step_view')stepMap[k].view++;if(x.event==='step_complete')stepMap[k].complete++;if(x.event==='validation_failed')stepMap[k].failed++});document.getElementById('steps').innerHTML=Object.keys(stepMap).length?`<table><thead><tr><th>步骤</th><th>浏览</th><th>完成</th><th>校验失败</th><th>完成率</th></tr></thead><tbody>${Object.entries(stepMap).map(([k,v])=>`<tr><td>${k}</td><td>${v.view}</td><td>${v.complete}</td><td>${v.failed}</td><td>${percent(v.complete,v.view)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无步骤数据</div>';const keys=['validation_failed','history_view','payment_test_skipped','restart'];document.getElementById('keyEvents').innerHTML=`<table><tbody>${keys.map(k=>`<tr><td>${names[k]}</td><td><span class="pill">${count(rows,k)}</span></td></tr>`).join('')}</tbody></table>`;document.getElementById('events').innerHTML=rows.length?`<table><thead><tr><th>时间</th><th>事件</th><th>案件</th><th>步骤</th><th>匿名访客</th></tr></thead><tbody>${rows.slice().reverse().slice(0,100).map(x=>`<tr><td>${new Date(x.occurredAt).toLocaleString('zh-CN')}</td><td>${names[x.event]||x.event}</td><td>${caseNames[x.properties?.caseType]||x.properties?.caseType||'-'}</td><td>${x.properties?.stepId||'-'}</td><td>${String(x.visitorId||'-').slice(0,18)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无埋点数据，请先在用户端完成一次测试。</div>'}
    function download(name,type,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
    function downloadJson(){download(`诉状埋点_${new Date().toISOString().slice(0,10)}.json`,'application/json',JSON.stringify(allEvents(),null,2))}
    function csvCell(v){return `"${String(v??'').replaceAll('"','""')}"`}
    function downloadCsv(){const rows=allEvents(),head=['时间','事件','案件类型','步骤','步骤序号','匿名访客','会话'];const lines=[head,...rows.map(x=>[x.occurredAt,names[x.event]||x.event,caseNames[x.properties?.caseType]||x.properties?.caseType||'',x.properties?.stepId||'',x.properties?.stepIndex||'',x.visitorId||'',x.sessionId||''])];download(`诉状埋点_${new Date().toISOString().slice(0,10)}.csv`,'text/csv;charset=utf-8','\ufeff'+lines.map(r=>r.map(csvCell).join(',')).join('\n'))}
    function importJson(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data))throw new Error();importedEvents=[...importedEvents,...data];render()}catch{alert('文件格式不正确，请导入后台导出的 JSON 文件。')}};reader.readAsText(file);e.target.value=''}
    function clearData(){if(!confirm('确定清空当前浏览器内的埋点数据吗？'))return;AppAnalytics.clear();importedEvents=[];render()}
    render();
  </script>
</body>
</html>
