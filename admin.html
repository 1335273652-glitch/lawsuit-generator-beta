<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>诉状助手 · 简版管理后台</title>
  <style>
    :root{--navy:#14283d;--gold:#b78633;--cream:#f6f1e8;--ink:#17202b;--muted:#737b84;--line:#e3e7eb;--bg:#f3f5f7;--green:#2a7a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{height:68px;background:var(--navy);color:#fff;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px}.mark{width:34px;height:34px;border:1px solid #d8b36c;display:grid;place-items:center;color:#d8b36c;font-family:serif}.top a{color:#dce5ee;text-decoration:none;font-size:13px}.layout{max-width:1180px;margin:0 auto;padding:26px 20px 60px;display:grid;grid-template-columns:220px 1fr;gap:20px}.side,.panel,.metric{background:#fff;border:1px solid var(--line);border-radius:12px}.side{padding:12px;height:max-content}.side button{width:100%;border:0;background:#fff;border-radius:9px;padding:13px 12px;text-align:left;color:var(--ink);cursor:pointer;margin:2px 0;font-weight:650}.side button.active{background:var(--navy);color:#fff}.side small{display:block;color:var(--muted);font-weight:400;margin-top:4px}.side button.active small{color:#cbd4dc}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.head h1{font-size:25px;margin:0 0 7px}.head p{font-size:13px;color:var(--muted);margin:0}.badge{font-size:12px;background:#edf5f1;color:var(--green);padding:6px 10px;border-radius:99px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:18px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:8px}.panel{padding:20px;margin-top:16px}.panel h2{font-size:17px;margin:0 0 15px}.list{border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}.icon{width:38px;height:38px;border-radius:10px;background:var(--cream);color:var(--gold);display:grid;place-items:center;flex:none;font-weight:700;font-size:11px}.copy{flex:1;min-width:0}.copy b,.copy small{display:block}.copy b{font-size:14px}.copy small{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.btn{border:1px solid #cfd5dc;background:#fff;color:var(--navy);border-radius:7px;padding:8px 11px;cursor:pointer;font-size:12px;font-weight:650}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.status{color:var(--green);font-size:12px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:45px 10px}.notice{background:#fff8e9;border-left:3px solid var(--gold);padding:12px 14px;color:#72571f;font-size:12px;line-height:1.7;margin-top:16px}.denied{max-width:520px;margin:100px auto;background:#fff;border-radius:14px;padding:40px;text-align:center}.denied a{color:var(--navy)}input[type=file]{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:125px}.metrics{grid-template-columns:repeat(2,1fr)}.head{gap:10px}.badge{white-space:nowrap}}
  </style>
</head>
<body>
  <div id="denied" class="denied" hidden><h2>无法进入管理后台</h2><p>当前体验账号不是管理员。</p><a href="miniapp.html">返回用户端</a></div>
  <div id="app" hidden><header class="top"><div class="brand"><div class="mark">法</div><strong>诉状助手 · 管理后台</strong></div><a href="miniapp.html?role=admin">返回用户端</a></header><main class="layout"><aside class="side"><button class="active" data-view="overview" onclick="openView('overview',this)">数据概览<small>核心数量</small></button><button data-view="users" onclick="openView('users',this)">用户记录<small>账号与使用情况</small></button><button data-view="questions" onclick="openView('questions',this)">问卷管理<small>题目与状态</small></button><button data-view="templates" onclick="openView('templates',this)">文书模板<small>上传与启用</small></button><button data-view="documents" onclick="openView('documents',this)">文书记录<small>查询与重新生成</small></button></aside><section><div class="head"><div><h1 id="title">数据概览</h1><p id="subtitle">只显示当前阶段需要管理的信息</p></div><span class="badge">管理员身份已验证</span></div><div id="content"></div><div class="notice">当前网页是功能演示版，数据保存在本浏览器。正式小程序由云函数再次校验管理员角色，普通用户无法通过修改网址获得后台数据。</div></section></main></div>
  <input id="templateFile" type="file" accept=".docx" onchange="addTemplate(event)">
  <script src="analytics.js"></script>
  <script>
    const params=new URLSearchParams(location.search),isAdmin=params.get('role')==='admin';document.getElementById(isAdmin?'app':'denied').hidden=false;
    const CASES={work:'工伤相关',traffic:'交通事故',premises:'公共场所',assault:'故意伤害',medical:'医疗损害',product:'产品责任',animal:'动物致害',falling:'高空坠物',labor:'提供劳务受害',school:'教育机构',other:'其他'};
    const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
    const titles={overview:['数据概览','查看用户、草稿和文书数量'],users:['用户记录','查看测试用户及最近使用情况'],questions:['问卷管理','查看题目，修改名称或启用状态'],templates:['文书模板','上传 Word 模板并指定当前版本'],documents:['文书记录','查看历史诉状或重新生成']};
    let questions=[],templates=read('lawsuit_admin_templates',[{name:'人身损害诉状模板集_v1.0.docx',version:'1.0',active:true}]);
    function docs(){return read('lawsuit-0.7beta-history',[])||[]}function draft(){return read('lawsuit-0.7beta-draft',null)}
    function openView(view,button){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));button?.classList.add('active');document.getElementById('title').textContent=titles[view][0];document.getElementById('subtitle').textContent=titles[view][1];render(view)}
    function render(view){const target=document.getElementById('content');if(view==='overview'){const events=window.AppAnalytics?AppAnalytics.events():[];target.innerHTML=`<div class="metrics"><div class="metric"><span>测试用户</span><strong>${events.length?1:0}</strong></div><div class="metric"><span>草稿数量</span><strong>${draft()?1:0}</strong></div><div class="metric"><span>文书总数</span><strong>${docs().length}</strong></div><div class="metric"><span>本机生成</span><strong>${events.filter(x=>x.event==='result_view').length}</strong></div></div>`;return}if(view==='users'){const used=!!(draft()||docs().length);target.innerHTML=`<div class="panel"><h2>用户列表</h2>${used?'<div class="list"><div class="row"><div class="icon">微</div><div class="copy"><b>微信测试用户</b><small>账号 U8X2K6P · 普通用户 · 本机体验数据</small></div></div></div>':'<div class="empty">暂无用户记录</div>'}</div>`;return}if(view==='questions'){renderQuestions(target);return}if(view==='templates'){renderTemplates(target);return}if(view==='documents'){const list=docs();target.innerHTML=`<div class="panel"><h2>生成记录</h2>${list.length?`<div class="list">${list.map((x,i)=>`<div class="row"><div class="icon">文</div><div class="copy"><b>${x.title||CASES[x.answers?.A1]||'民事起诉状'}</b><small>${CASES[x.answers?.A1]||'人身损害案件'} · 已生成</small></div><button class="btn" onclick="regenerate(${i})">重新生成</button></div>`).join('')}</div>`:'<div class="empty">暂无文书记录</div>'}</div>`}}
    function renderQuestions(target=document.getElementById('content')){target.innerHTML=`<div class="panel"><h2>题目列表</h2>${questions.length?`<div class="list">${questions.slice(0,115).map((q,i)=>`<div class="row"><div class="icon">${q.id||i+1}</div><div class="copy"><b>${q.title||q.question||'未命名题目'}</b><small>${q.type||'题目'} · ${q.__disabled?'已停用':'已启用'}</small></div><button class="btn" onclick="renameQuestion(${i})">修改</button><button class="btn" onclick="toggleQuestion(${i})">${q.__disabled?'启用':'停用'}</button></div>`).join('')}</div>`:'<div class="empty">正在读取题库…</div>'}</div>`}
    function renameQuestion(i){const title=prompt('修改题目名称',questions[i].title||questions[i].question||'');if(title?.trim()){questions[i].title=title.trim();renderQuestions()}}function toggleQuestion(i){questions[i].__disabled=!questions[i].__disabled;renderQuestions()}
    function renderTemplates(target=document.getElementById('content')){target.innerHTML=`<button class="btn primary" onclick="document.getElementById('templateFile').click()">上传 Word 模板</button><div class="panel"><h2>模板列表</h2><div class="list">${templates.map((x,i)=>`<div class="row"><div class="icon">W</div><div class="copy"><b>${x.name}</b><small>版本 ${x.version} · ${x.active?'当前使用':'未启用'}</small></div>${x.active?'<span class="status">使用中</span>':`<button class="btn" onclick="activateTemplate(${i})">启用</button>`}</div>`).join('')}</div></div>`}
    function addTemplate(e){const file=e.target.files[0];if(!file)return;templates.unshift({name:file.name,version:'1.0',active:false});localStorage.setItem('lawsuit_admin_templates',JSON.stringify(templates));renderTemplates();e.target.value=''}function activateTemplate(i){templates.forEach((x,n)=>x.active=n===i);localStorage.setItem('lawsuit_admin_templates',JSON.stringify(templates));renderTemplates()}function regenerate(i){const record=docs()[i];localStorage.setItem('lawsuit-0.7beta-draft',JSON.stringify({screen:'preview',answers:record.answers||{},path:['A1'],index:0}));location.href='index.html'}
    if(isAdmin){fetch('questions.json').then(r=>r.json()).then(data=>{questions=data.questions||[];if(document.querySelector('[data-view=questions]').classList.contains('active'))renderQuestions()}).catch(()=>{});render('overview')}
  </script>
</body>
</html>
