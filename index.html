<script>

let paramsData={provinces:[]};
let questions=[
 {id:'A1',title:'本次人身伤害是在什么场景下发生的？（单选，决定案件类型）',type:'choice',required:true,options:[['work','工作过程中因工作原因受伤，或上下班途中发生交通事故','→ A2'],['traffic','道路上的机动车/非机动车交通事故','→ A3'],['premises','商场、酒店、景区、车站等经营或公共场所内受伤','→ C1'],['assault','被他人殴打、故意伤害、寻衅滋事','→ C1'],['medical','诊疗、手术、用药等医疗行为造成损害','→ C1'],['product','因产品、食品、药品、化妆品缺陷受伤','→ C1'],['animal','被饲养的动物、流浪动物伤害','→ C1'],['falling','被高空抛掷物、坠落物砸伤','→ C1'],['labor','在提供劳务、帮工、承揽、装修、装卸等作业中受伤','→ C1'],['school','未成年子女在学校、幼儿园、培训机构受伤','→ C1'],['other','其他情形（如网络侵权、环境污染、物件致害）','→ C1']]},
 {id:'A2',title:'该次伤害属于下列哪种工伤情形？',type:'choice',when:a=>a.A1==='work',options:[['14_1','工作时间、工作场所内，因工作原因受到事故伤害','→ A3'],['14_2','工作时间前后在工作场所内，从事预备性或收尾性工作受伤','→ A3'],['14_3','工作时间、工作场所内，因履行工作职责受到暴力等意外伤害','→ A3'],['14_4','患职业病','→ A3'],['14_5','因工外出期间，因工作原因受伤或发生事故下落不明','→ A3'],['14_6','上下班途中，受到非本人主要责任的交通事故等伤害','→ A3'],['15_1','工作时间和工作岗位，突发疾病死亡或48小时内抢救无效死亡','→ A3'],['15_2','抢险救灾等维护国家利益、公共利益活动中受伤','→ A3'],['15_3','退役军人旧伤复发（已取得革命伤残军人证）','→ A3']]},
 {id:'A3',title:'本次事故是否同时可能构成工伤？（决定是否并行主张工伤保险待遇）',type:'choice',when:a=>a.A1==='work'||a.A1==='traffic',options:[['yes','是，属于单位职工且因工作/上下班途中受伤，已认定或正在认定','→ C1'],['no','否，本人不是该单位职工，或不属于上下班途中','→ C1'],['unknown','不确定，需要判断劳动关系与“上下班途中”要件','→ C1']]},
 {id:'A4',title:'目前案件进展到哪一步？（决定生成哪一种文书）',type:'choice',options:[['treating','仍在治疗中，尚未终结','→ B1'],['untested','治疗已终结，尚未做伤残鉴定','→ B1'],['tested','已做伤残鉴定/劳动能力鉴定','→ B1'],['negotiating','已与对方或单位协商，未达成一致','→ B1'],['ready','准备起诉，尚未立案','→ B1'],['inprocess','已进入诉讼或仲裁程序','→ B1']]},
 {id:'B1',title:'受害人目前的生存状态？',type:'choice',required:true,options:[['alive','健在，本人作为原告','→ B3'],['dead','已因本次伤害死亡，由近亲属起诉','→ B2']]},
 {id:'B2',title:'主张权利的近亲属共几人？（配偶、子女、父母等第一顺序继承人）',type:'number',when:a=>a.B1==='dead',required:true,placeholder:'请输入人数'},
 {id:'B3',title:'原告姓名（多人用顿号分隔，按起诉状顺序）',type:'text',required:true,placeholder:'请输入姓名'},
 {id:'B4',title:'原告性别',type:'choice',options:[['male','男',''],['female','女','']]},
 {id:'B5',title:'原告出生日期（用于计算赔偿年限）',type:'dateParts',required:true},
 {id:'B7',title:'原告住所地（省/市/区县 + 详细地址）',type:'text',required:true,placeholder:'请输入住所地'},
 {id:'B9',title:'原告户籍性质（仅用于判断可否主张住所地标准）',type:'choice',options:[['urban','城镇户籍',''],['rural','农村户籍',''],['other','其他（境外、集体户等）','']]},
 {id:'B10',title:'原告主要收入来源形式',type:'choice',options:[['employee','单位职工，有固定工资','→ C1'],['self','个体经营/自由职业，收入不固定','→ C1'],['farmer','务农','→ C1'],['retired','已退休，被返聘或仍有劳务收入','→ C1'],['student','在校学生','→ C1'],['none','无业/家务劳动','→ C1']]},
 {id:'C1',title:'事故发生（受伤）的具体日期',type:'dateParts',required:true},
 {id:'C2',title:'事故发生地（省/市/区县 + 具体路段或场所名称）',type:'text',required:true,placeholder:'请输入事故发生地'},
 {id:'C3',title:'请按“谁—在做什么—怎么受伤—现场情况”描述经过（3—5句即可）',type:'area',required:true,placeholder:'请输入事故经过'},
 {id:'C4',title:'当时是否报警或呼叫急救？',type:'choice',options:[['police','已报警并留有出警记录',''],['none','未报警',''],['120','仅呼叫120，未报警','']]},
 {id:'C5',title:'是否取得《道路交通事故认定书》？',type:'choice',when:a=>a.A1==='traffic'||a.A2==='14_6',options:[['yes','已取得','→ C6'],['no','交警未出具（仅作简易处理/未报警）','→ C8'],['pending','仍在处理中，尚未出具','→ C8']]},
 {id:'C6',title:'认定书对本次事故的责任划分是？',type:'choice',when:a=>a.C5==='yes',options:[['all','对方全部责任','→ C7'],['major','对方主要责任','→ C7'],['equal','同等责任','→ C7'],['minor','对方次要责任','→ C7'],['none','对方无责任','→ C7'],['unknown','未认定/无法认定','→ C7']]},
 {id:'C7',title:'对方应承担的赔偿责任比例（%，据认定书或预估）',type:'number',when:a=>a.C5==='yes',placeholder:'请输入 0—100'},
 {id:'D1',title:'本次伤害造成的后果（可多选）',type:'multi',options:[['general','一般伤害（治疗后可恢复，未构成伤残）',''],['disability','构成伤残',''],['death','死亡',''],['mental','造成严重精神障碍','']]},
 {id:'D2',title:'住院天数（未住院填0）',type:'number',required:true,placeholder:'请输入天数'},
 {id:'D3',title:'是否已构成伤残？',type:'choice',when:a=>a.B1==='alive',options:[['yes','已鉴定构成伤残','→ D4'],['no','经鉴定不构成伤残','→ D7'],['pending','尚未鉴定','→ D7']]},
 {id:'D4',title:'伤残等级（以鉴定意见书为准）',type:'choice',when:a=>a.D3==='yes',options:[['1','1级伤残','→ D5'],['2','2级伤残','→ D5'],['3','3级伤残','→ D5'],['4','4级伤残','→ D5'],['5','5级伤残','→ D5'],['6','6级伤残','→ D5'],['7','7级伤残','→ D5'],['8','8级伤残','→ D5'],['9','9级伤残','→ D5'],['10','10级伤残','→ D5']]},
 {id:'D7',title:'是否需要后续治疗（二次手术、康复、取内固定等）？',type:'choice',options:[['yes','需要，已有医嘱或鉴定意见','→ D8'],['possible','可能需要，尚无明确意见','→ D8'],['no','不需要','→ D8']]},
 {id:'D9',title:'误工期（天，依鉴定意见或医嘱；未鉴定可填住院天数+医嘱休息天数）',type:'number',placeholder:'请输入天数'},
 {id:'D10',title:'护理期（天）',type:'number',when:a=>a.B1==='alive',placeholder:'请输入天数'},
 {id:'D11',title:'营养期（天）',type:'number',placeholder:'请输入天数'},
 {id:'E1',title:'医疗费总额（元，含门诊+住院+外购药，凭票据）',type:'money',required:true,placeholder:'请输入金额'},
 {id:'E2',title:'其中医保/大病保险已报销金额（元，无则填0）',type:'money',placeholder:'请输入金额'},
 {id:'E3',title:'住院伙食补助费标准（元/天，参照当地国家机关一般工作人员出差伙食补助标准，通常50—100）',type:'money',placeholder:'请输入标准'},
 {id:'E4',title:'营养费标准（元/天，通常30—50，需医嘱或鉴定支持）',type:'money',placeholder:'请输入标准'},
 {id:'E5',title:'护理人数（原则上1人；医疗机构或鉴定机构有明确意见的可增加）',type:'number',when:a=>a.B1==='alive',placeholder:'请输入人数'},
 {id:'E6',title:'护理费标准（元/天；护理人员有收入的参照误工费，无收入或雇请护工按当地护工同等级劳务报酬）',type:'money',when:a=>a.B1==='alive',placeholder:'请输入标准'},
 {id:'E7',title:'受害人月收入（元，受伤前12个月平均应发工资或经营净收入）',type:'money',placeholder:'请输入金额'},
 {id:'E8',title:'收入证明的完备程度？',type:'choice',options:[['complete','劳动合同+工资流水+完税证明齐全',''],['partial','部分具备（如仅有流水或仅有单位证明）',''],['none','无书面证据','']]},
 {id:'E9',title:'交通费（元，凭票据；含受害人及必要陪护人员就医、转院）',type:'money',placeholder:'请输入金额'},
 {id:'E10',title:'住宿费（元，外地治疗且无法住院时受害人及陪护人员的合理住宿支出）',type:'money',placeholder:'请输入金额'},
 {id:'E11',title:'被扶养人人数（无则填0）',type:'number',when:a=>a.B1==='alive',placeholder:'请输入人数'},
 {id:'E13',title:'精神损害抚慰金期望金额（元，可填0由系统按伤残等级给出建议区间）',type:'money',placeholder:'请输入金额'},
 {id:'E14',title:'财产损失（元：车辆维修、衣物、手机、眼镜、首饰等，凭定损单/发票）',type:'money',placeholder:'请输入金额'},

function loadResources(){return Promise.all([fetch('questions.json?v=0.7').then(r=>{if(!r.ok)throw new Error('题库读取失败');return r.json()}),fetch('params_cn.json?v=0.7').then(r=>{if(!r.ok)throw new Error('参数读取失败');return r.json()})]).then(([data,params])=>{paramsData=params;questions=data.questions.map(q=>({...q,type:q.type==='single'?'choice':q.type==='multi'?'multi':q.type==='date_parts'?'dateParts':q.type==='textarea'?'area':q.type,options:(q.options||[]).map(o=>[o.value,o.label,o.next?`→ ${o.next}`:''])}));const i=questions.findIndex(q=>q.id==='D1');questions.splice(i,0,{id:'E0',module:'CLAIMS',title:'本次准备主张哪些赔偿项目？',type:'multi',required:true,hint:'可以多选。系统只会继续询问所选项目需要的数据。',options:[['medical','医疗费',''],['meal','住院伙食补助费',''],['nutrition','营养费',''],['followup','后续治疗费',''],['lost','误工费',''],['care','护理费',''],['transport','交通费',''],['lodging','住宿费',''],['disability','残疾赔偿金',''],['dependants','被扶养人生活费',''],['assistive','残疾辅助器具费',''],['mental','精神损害抚慰金',''],['property','财产损失',''],['appraisal','鉴定费等合理支出','']]});save();render()}).catch(()=>render())}
function save(){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveState').textContent='● 草稿已保存在本机';}
const aliases={A1:{work:'a',traffic:'b',premises:'c',assault:'d',medical:'e',product:'f',animal:'g',falling:'h',labor:'i',school:'j',other:'k'},A2:{'14_1':'a','14_2':'b','14_3':'c','14_4':'d','14_5':'e','14_6':'f','15_1':'g','15_2':'h','15_3':'i'},A4:{treating:'a',untested:'b',tested:'c',negotiating:'d',ready:'e',litigating:'f',inprocess:'f'},B1:{alive:'a',dead:'b'},C5:{yes:'a',no:'b',pending:'c'},D3:{yes:'a',no:'b',pending:'c'},D7:{yes:'a',possible:'b',no:'c'},D12:{yes:'a',no:'b'},F1:{yes:'a',no:'b',unknown:'c'},F3:{labor:'a',help:'b',contract:'c',none:'d'},G8:{yes:'a'},G10:{yes:'a'},I1:{premises:'a',assault:'b',animal:'c',falling:'d',product:'e',school:'f',labor:'g',medical:'h',network:'i',other:'j'}};
function conditionMatches(expr){return expr.split('|').some(part=>{const m=part.match(/^([A-Z]\d+[a-z]?)(=|>|<)(.+)$/);if(!m)return true;const [,id,op,expected]=m;const value=state.answers[id];if(op==='>')return Number(value)>Number(expected);if(op==='<')return Number(value)<Number(expected);return value===expected||(aliases[id]&&aliases[id][expected]===value)})}
function moduleApplies(q){const a1=state.answers.A1;const traffic=a1==='b'||a1==='traffic'||state.answers.A2==='f'||state.answers.A2==='14_6';const work=a1==='a'||a1==='work'||state.answers.A3==='a'||state.answers.A3==='yes';if(q.module==='G')return work;if(q.module==='H')return traffic;if(q.module==='I')return !traffic&&!work;return true}
function hasClaim(name){return Array.isArray(state.answers.E0)&&state.answers.E0.includes(name)}
function quickQuestionApplies(q){const id=q.id;if(q.module==='K')return false;if(q.module==='B')return !['B9'].includes(id);if(q.module==='D'){if(['D1','D2','D3'].includes(id))return true;if(['D4','D6'].includes(id))return hasClaim('disability')||hasClaim('dependants');if(id==='D7'||id==='D7a')return hasClaim('followup');if(id==='D9')return hasClaim('lost');if(id==='D10')return hasClaim('care');if(id==='D11')return hasClaim('nutrition');if(['D12','D12a','D12b','D12c'].includes(id))return hasClaim('assistive');return false}if(q.module==='E'){const map={E1:'medical',E2:'medical',E3:'meal',E4:'nutrition',E5:'care',E6:'care',E7:'lost',E8:'lost',E9:'transport',E10:'lodging',E11:'dependants',E12:'dependants',E13:'mental',E14:'property',E15:'appraisal'};return id==='E16'||!map[id]||hasClaim(map[id])}if(q.module==='G')return ['G1','G2','G3','G4','G5','G6','G8','G10','G11','G12'].includes(id);if(q.module==='H')return ['H1','H2','H3','H6','H7'].includes(id);if(q.module==='J')return ['J1','J2','J4','J5'].includes(id);return true}
function activeQs(){return questions.filter(q=>quickQuestionApplies(q)&&moduleApplies(q)&&(!q.showWhen&&!q.when||q.showWhen&&conditionMatches(q.showWhen)||q.when&&q.when(state.answers)));}
function setSteps(n){['step1','step2','step3'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',i<=n));}
function shell(title,desc,body){return `<div class="hero"><div class="eyebrow">LEGAL DOCUMENT BUILDER</div><h1>${title}</h1><p>${desc}</p></div>${body}`}
function dateParts(value,id){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');const year=Number(m?.[1])||'';const month=Number(m?.[2])||'';const day=Number(m?.[3])||'';const current=new Date().getFullYear();const years=Array.from({length:current-1899},(_,i)=>current-i);const days=month&&year?new Date(year,month,0).getDate():31;return `<div class="date-parts"><select id="date-year-${id}" onchange="updateDate('${id}')"><option value="">年</option>${years.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}年</option>`).join('')}</select><select id="date-month-${id}" onchange="updateDate('${id}')"><option value="">月</option>${Array.from({length:12},(_,i)=>i+1).map(x=>`<option value="${x}" ${x===month?'selected':''}>${x}月</option>`).join('')}</select><select id="date-day-${id}" onchange="updateDate('${id}')"><option value="">日</option>${Array.from({length:days},(_,i)=>i+1).map(x=>`<option value="${x}" ${x===day?'selected':''}>${x}日</option>`).join('')}</select></div>`}
function updateDate(id){const y=document.getElementById(`date-year-${id}`).value,m=document.getElementById(`date-month-${id}`).value,d=document.getElementById(`date-day-${id}`),old=Number(d.value)||0,n=y&&m?new Date(Number(y),Number(m),0).getDate():31;d.innerHTML='<option value="">日</option>'+Array.from({length:n},(_,i)=>`<option value="${i+1}" ${i+1===old?'selected':''}>${i+1}日</option>`).join('');state.answers[id]=y&&m&&d.value?`${y}-${String(m).padStart(2,'0')}-${String(d.value).padStart(2,'0')}`:'';save()}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function defendantList(){if(!Array.isArray(state.answers.F12))state.answers.F12=[];return state.answers.F12}
function addDefendant(){defendantList().push({type:'person',name:'',idNumber:'',address:'',phone:'',legalRepresentative:'',position:'',role:'',responsibility:'',plateNo:'',policyNo:''});save();render()}
function removeDefendant(index){defendantList().splice(index,1);save();render()}
function updateDefendant(index,key,value){defendantList()[index][key]=value;save()}
function renderDefendants(){const list=defendantList();const cards=list.map((p,i)=>`<div class="party-card"><div class="party-head"><strong>被告 ${i+1}</strong><button class="mini-btn danger" type="button" onclick="removeDefendant(${i})">删除</button></div><div class="party-grid"><div class="field"><label>被告类型 *</label><select class="party-type" onchange="updateDefendant(${i},'type',this.value)"><option value="person" ${p.type==='person'?'selected':''}>自然人</option><option value="company" ${p.type==='company'?'selected':''}>单位</option><option value="insurer" ${p.type==='insurer'?'selected':''}>保险公司</option></select></div><div class="field"><label>案件身份 *</label><input class="party-role" value="${escapeHtml(p.role)}" oninput="updateDefendant(${i},'role',this.value)" placeholder="如驾驶人、车主、用人单位、保险公司" /></div><div class="field"><label>姓名或单位名称 *</label><input class="party-name" value="${escapeHtml(p.name)}" oninput="updateDefendant(${i},'name',this.value)" placeholder="请输入完整名称" /></div><div class="field"><label>身份证号或统一社会信用代码</label><input class="party-id" value="${escapeHtml(p.idNumber)}" oninput="updateDefendant(${i},'idNumber',this.value)" placeholder="不清楚可留空" /></div><div class="field wide"><label>住所地或单位地址 *</label><input class="party-address" value="${escapeHtml(p.address)}" oninput="updateDefendant(${i},'address',this.value)" placeholder="省、市、区县及详细地址" /></div><div class="field"><label>联系电话</label><input class="party-phone" value="${escapeHtml(p.phone)}" oninput="updateDefendant(${i},'phone',this.value)" placeholder="不清楚可留空" /></div><div class="field"><label>法定代表人及职务</label><input class="party-legal" value="${escapeHtml([p.legalRepresentative,p.position].filter(Boolean).join(' / '))}" oninput="const x=this.value.split('/');updateDefendant(${i},'legalRepresentative',(x[0]||'').trim());updateDefendant(${i},'position',(x[1]||'').trim())" placeholder="单位或保险公司填写" /></div><div class="field"><label>车牌号</label><input class="party-plate" value="${escapeHtml(p.plateNo)}" oninput="updateDefendant(${i},'plateNo',this.value)" placeholder="车辆相关被告填写" /></div><div class="field"><label>保单号</label><input class="party-policy" value="${escapeHtml(p.policyNo)}" oninput="updateDefendant(${i},'policyNo',this.value)" placeholder="保险公司填写" /></div><div class="field wide"><label>责任关系说明</label><textarea class="party-responsibility" oninput="updateDefendant(${i},'responsibility',this.value)" placeholder="简述其与事故及赔偿责任的关系">${escapeHtml(p.responsibility)}</textarea></div></div></div>`).join('');return `${cards}<div id="party-error" style="color:var(--red);font-size:12px;margin:10px 0"></div><button class="mini-btn" type="button" onclick="addDefendant()">＋ 添加被告</button>`}
const groupDefs=[
 {id:'A',title:'确认案件类型',modules:['A']},
 {id:'B',title:'原告基本信息',modules:['B']},
 {id:'C',title:'事故经过与责任',modules:['C']},
 {id:'CLAIMS',title:'选择赔偿项目',modules:['CLAIMS']},
 {id:'D',title:'治疗与伤情',modules:['D']},
 {id:'E',title:'赔偿计算数据',modules:['E']},
 {id:'F',title:'责任主体与被告',modules:['F']},
 {id:'SPECIAL',title:'案件专项信息',modules:['G','H','I']},
 {id:'J',title:'管辖与起诉',modules:['J']}
];
function questionGroups(){const qs=activeQs().filter(q=>q.id!=='A1');return groupDefs.map(g=>({...g,questions:qs.filter(q=>g.modules.includes(q.module))})).filter(g=>g.questions.length)}
function updateField(id,value){state.answers[id]=value;save()}
function renderQuestion(q){const val=state.answers[q.id]??(q.type==='multi'||q.type==='defendants'?[]:'');let input='';if(q.type==='choice'||q.type==='single'||q.type==='multi')input=`<div class="choice-grid">${q.options.map(o=>`<button type="button" class="choice ${(q.type==='multi'?val.includes(o[0]):val===o[0])?'selected':''}" onclick="${q.type==='multi'?`toggleMulti('${q.id}','${o[0]}')`:`answer('${q.id}','${o[0]}')`}"><b>${o[1]}</b>${o[2]?`<span>${o[2]}</span>`:''}</button>`).join('')}</div>`;else if(q.type==='dateParts'||q.type==='date_parts')input=`<div class="field">${dateParts(val,q.id)}</div>`;else if(q.type==='defendants')input=renderDefendants();else input=`<div class="field">${q.type==='area'||q.type==='textarea'?`<textarea id="input-${q.id}" oninput="updateField('${q.id}',this.value)" placeholder="${q.placeholder||''}">${escapeHtml(val)}</textarea>`:`<input id="input-${q.id}" type="${q.type==='number'||q.type==='money'?'number':'text'}" value="${escapeHtml(val)}" oninput="updateField('${q.id}',this.value)" placeholder="${q.placeholder||''}" />`}</div>`;return `<section class="question-block" data-qid="${q.id}"><span class="tag">${q.type==='multi'?'多项选择':q.type==='choice'||q.type==='single'?'单项选择':q.type==='defendants'?'被告信息':'信息填写'}</span><h2>${q.title}${q.required?' *':''}</h2><p class="sub">${q.hint||'为确保生成内容真实、准确，请填写真实信息。'}</p>${input}</section>`}
function render(){const app=document.getElementById('app');if(state.screen==='start'){setSteps(0);app.innerHTML=shell('从案情开始，生成一份诉状草稿','先选择案件类型，系统会将同类信息合并填写，并隐藏与本案无关的问题。',`<div class="notice">0.7β 精简问卷版：同类信息合并填写，并先选择需要主张的赔偿项目，只展示相关问题。题库变量与计算规则保持不变。</div><div class="card"><h2>A1* 本次人身伤害是在什么场景下发生的？</h2><p class="sub">请根据实际情况选择，确保生成内容真实、准确。</p><div class="choice-grid">${questions[0].options.map(o=>`<button class="choice" onclick="start('${o[0]}')"><b>${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div></div>`);return}if(state.screen==='question'){setSteps(1);const groups=questionGroups();state.index=Math.min(state.index,Math.max(0,groups.length-1));const group=groups[state.index];if(!group){state.screen='preview';save();render();return}app.innerHTML=shell(group.title,`第 ${state.index+1} 步，共 ${groups.length} 步。本页包含 ${group.questions.length} 项与本案相关的信息。`,`<div class="qmeta"><span>步骤 ${state.index+1} / ${groups.length}</span><span>${group.id}</span></div><div class="progress"><i style="width:${Math.round(((state.index+1)/groups.length)*100)}%"></i></div><div class="compact-tip">已自动隐藏无关问题；带 * 的项目必须填写。页面内容会自动保存在本机。</div><div class="card"><div class="group-title"><h2>${group.title}</h2><span class="group-count">${group.questions.length} 项</span></div>${group.questions.map(renderQuestion).join('')}<div id="group-error" class="notice" style="display:none;color:var(--red)"></div><div class="actions"><button class="btn secondary" onclick="back()">${state.index?'上一步':'返回首页'}</button><button class="btn primary" onclick="next()">${state.index===groups.length-1?'生成预览':'保存并继续'}</button></div></div>`);return}if(state.screen==='preview'){setSteps(2);app.innerHTML=shell('诉状预览','已根据你的答题路径生成诉状结构。预览阶段隐藏费用明细，确认后进入付费环节。',`<div class="notice">预览内容可免费查看，但费用项目、计算过程和金额合计暂不展示。</div><div class="doc">${documentText(false)}</div><div class="actions"><button class="btn secondary" onclick="backToQuestions()">返回修改</button><button class="btn gold" onclick="state.screen='pay';save();render()">继续获取完整诉状</button></div>`);return}if(state.screen==='pay'){setSteps(2);app.innerHTML=shell('获取完整诉状','正式产品将在这里调起微信支付。当前版本提供跳过付费按钮，用于测试生成结果。',`<div class="card"><span class="tag">单一套餐</span><h2>完整诉状 Word 文书</h2><p class="sub">费用：9.9 元。支付后查看费用数据并下载 Word。</p><div class="notice">测试专用：点击下方按钮跳过支付，直接查看带金额的完整诉状。</div><div class="actions"><button class="btn secondary" onclick="state.screen='preview';render()">返回预览</button><button class="btn gold" onclick="state.screen='result';save();render()">跳过付费（测试）</button></div></div>`);return}setSteps(2);app.innerHTML=shell('完整诉状（已解锁）','以下内容包含费用项目、计算公式和保险责任分配。正式提交前请由法律专业人员复核。',`<div class="demo"><b>测试版已跳过付费</b>：正式版本将在这里校验 9.9 元订单后解锁。</div><div class="card"><div class="result-head"><div><span class="tag">已解锁费用数据</span><h2>费用计算结果</h2></div><span class="risk">仅供参考 · 建议复核</span></div><div class="calc">${calcTable()}</div></div><div class="doc" style="margin-top:18px">${documentText(true)}</div><div class="actions"><button class="btn secondary" onclick="restart()">重新填写</button></div><div class="footer-note">本演示版用于验证精简问卷、计算规则和诉状内容；正式版本仅交付 Word 文件。</div>`)}
function start(v){state.answers={A1:v};state.path=['A1'];state.index=0;state.screen='question';save();render()}
function answer(id,v){state.answers[id]=v;save();render()}
function toggleMulti(id,v){const values=Array.isArray(state.answers[id])?state.answers[id]:[];state.answers[id]=values.includes(v)?values.filter(x=>x!==v):[...values,v];if(id==='E0')state.answers.K2=state.answers[id].includes('mental')?'a':'b';save();render()}
function next(){const groups=questionGroups(),group=groups[state.index];let missing='';for(const q of group.questions){const value=state.answers[q.id];if(q.type==='defendants'){const list=defendantList();if(list.length===0||list.some(p=>!p.name.trim()||!p.address.trim()||!p.role.trim()))missing='请至少添加一名被告，并填写其名称、案件身份和地址。'}else if(q.required&&(value===''||value==null||(Array.isArray(value)&&value.length===0)))missing=`请填写“${q.title}”。`;if(missing)break}if(missing){const el=document.getElementById('group-error');el.textContent=missing;el.style.display='block';return}if(state.index>=groups.length-1){state.screen='preview'}else state.index++;save();render()}
function back(){if(state.index===0){state.screen='start'}else state.index--;save();render()}
function restart(){localStorage.removeItem(KEY);location.reload()}
function money(n){if(window.__hideAmounts)return '【付费后查看】';return (Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function calc(){return LawsuitEngine.calcCase(state.answers,{provinces:paramsData.provinces||[],lostWageDaysPerMonth:30})}
function answerLabel(id,value){const q=questions.find(x=>x.id===id);if(Array.isArray(value))return value.map(v=>answerLabel(id,v)).join('、');const option=q&&q.options.find(o=>o[0]===value);return option?option[1]:(value||'【待补】')}
function defendantsHtml(value){if(!Array.isArray(value)||!value.length)return '<p>被告：【待补：责任主体名称、住所地及负责人信息】。</p>';return value.map((p,i)=>{const unit=p.type==='company'||p.type==='insurer';const identity=p.idNumber||(unit?'【待补：统一社会信用代码】':'【待补：身份证号】');const legal=unit?`，法定代表人：${escapeHtml(p.legalRepresentative||'【待补】')}${p.position?`，职务：${escapeHtml(p.position)}`:''}`:'';const vehicle=p.plateNo?`，关联车辆：${escapeHtml(p.plateNo)}`:'';const policy=p.policyNo?`，保单号：${escapeHtml(p.policyNo)}`:'';const reason=p.responsibility?`，责任关系：${escapeHtml(p.responsibility)}`:'';return `<p><b>被告${i+1}：</b>${escapeHtml(p.name)}，${unit?'统一社会信用代码':'公民身份号码'}：${escapeHtml(identity)}，住所地：${escapeHtml(p.address)}，联系电话：${escapeHtml(p.phone||'【待补】')}${legal}，案件身份：${escapeHtml(p.role)}${vehicle}${policy}${reason}。</p>`}).join('')}
function calcTable(){const c=calc();const rows=c.items.map(x=>`<tr><td>${x.name}</td><td>${x.formula||'按实际填写金额'}</td><td>${money(x.amount)} 元</td></tr>`).join('')||'<tr><td colspan="3">暂未录入可计算的费用项目</td></tr>';const insurance=LawsuitEngine.routeCase(state.answers).caseType==='traffic'?`<tr><td>交强险分项赔付</td><td>医疗 ${money(c.jq.medical)} + 死亡伤残 ${money(c.jq.disability)} + 财产 ${money(c.jq.property)}</td><td>${money(c.jq.sum)} 元</td></tr><tr><td>商业三者险</td><td>交强险外余额 × 责任比例，在保额内赔付</td><td>${money(c.commercial)} 元</td></tr><tr><td>责任主体承担</td><td>保险赔付后的不足及单列费用</td><td>${money(c.selfPay)} 元</td></tr>`:'';const work=(c.work.oneTime||[]).map(x=>`<tr><td>${x.name}（工伤）</td><td>${x.formula}</td><td>${money(x.amount)} 元</td></tr>`).join('');const warnings=c.warnings.length?`<div class="notice"><b>待复核：</b>${c.warnings.join('；')}</div>`:'';return `<table><tr><th>项目</th><th>计算过程</th><th>金额</th></tr>${rows}${insurance}${work}<tr><td>已收赔偿/垫付款</td><td>仅从最终请求金额中扣减</td><td>− ${money(c.paid)} 元</td></tr><tr class="total"><td>损失合计</td><td>各项损失之和；工伤待遇另列</td><td>${money(c.total)} 元</td></tr><tr class="total"><td>扣减后请求金额</td><td>应获赔金额 ${money(c.payable)} − 已收款 ${money(c.paid)}</td><td>${money(c.net)} 元</td></tr></table>${warnings}`}
function documentText(showAmount=true){const a=state.answers,c=calc();const traffic=LawsuitEngine.routeCase(a).caseType==='traffic';const type=traffic?'机动车交通事故责任纠纷':a.A1==='work'||a.A1==='a'?'劳动争议/工伤保险待遇':'生命权、身体权、健康权纠纷';const amount=showAmount?`<span class="amount">${money(c.net)} 元</span>`:'【付费后查看】';const defendants=defendantsHtml(a.F12);return `<h3>民 事 起 诉 状</h3><p class="center">（${type}）</p><p><b>案由：</b>${type}</p><div class="doc-section">原告</div><p>${a.B3||'【待补：原告姓名】'}，性别：${LawsuitEngine.genderText[a.B4]||(a.B4||'【待补】')}，出生日期：${a.B5||'【待补】'}，住${a.B7||'【待补：住所地】'}，公民身份号码：${a.B6||'【待补】'}，联系电话：${a.B8||'【待补】'}。</p><div class="doc-section">被告</div>${defendants}<div class="doc-section">诉讼请求</div><ol><li>判令被告赔偿原告各项损失共计${amount}，具体项目、计算公式及金额见赔偿计算明细。</li><li>${traffic?'上述损失由交强险承保公司在责任限额内先行赔偿，超出部分由商业三者险及责任主体依法承担。':'判令被告依法承担相应赔偿责任。'}</li><li>本案诉讼费用及依法应由被告承担的相关费用由被告承担。</li></ol><div class="doc-section">事实与理由</div><p><b>一、基础关系与事发背景</b></p><p>${a.C1||'【待补：事故日期】'}，原告在${a.C2||'【待补：事故地点】'}发生人身损害。</p><p><b>二、事发经过</b></p><p>${a.C3||'【待补：事故经过】'}</p><p><b>三、责任认定</b></p><p>报警或急救情况：${answerLabel('C4',a.C4)}；事故认定及责任比例：${answerLabel('C6',a.C6)}、${a.C7||'【待补】'}%。</p><p><b>四、损害后果与治疗</b></p><p>住院${a.D2||'【待补】'}天；损害后果：${answerLabel('D1',a.D1)}；伤残鉴定情况：${answerLabel('D3',a.D3)}。</p><p><b>五、损失构成</b></p><p>${showAmount?`经计算，损失合计${money(c.total)}元，扣减已收款后请求金额为${money(c.net)}元；采用${c.province||'待确认地区'}基数。`:'费用项目、计算过程及金额在付费解锁后展示。'}</p><p><b>六、协商情况</b></p><p>原告已收到赔偿/垫付款${showAmount?money(c.paid):'【付费后查看】'}元，该款应在诉请中扣除；其余损失未获妥善赔偿。</p><p><b>七、法律依据</b></p><p>依据《中华人民共和国民法典》及相关人身损害赔偿司法解释、道路交通安全法或工伤保险条例等规定，提起本诉，请依法判如所请。</p><div class="doc-section">此致</div><p>${a.J4||'【待补：受诉法院全称】'}</p><p style="margin-top:28px">具状人：${a.B3||'【待补】'}</p><p>${new Date().toLocaleDateString('zh-CN')}</p><div class="doc-section">附：证据清单</div><p>1．原告身份证明及主体资格材料；2．病历、诊断证明、出院记录；3．医疗费票据及费用清单；4．鉴定意见或医嘱；5．事故认定书、报警记录、监控或证人材料；6．赔偿款收付凭证及其他相关证据。</p>${showAmount?`<div class="doc-section">赔偿计算明细</div>${calcTable()}`:''}`}
const _documentText=documentText;documentText=function(showAmount=true){window.__hideAmounts=!showAmount;return _documentText(showAmount)};const _calcTable=calcTable;calcTable=function(){window.__hideAmounts=false;return _calcTable()};
function backToQuestions(){state.screen='question';state.index=Math.max(0,questionGroups().length-1);render()}
loadResources();
