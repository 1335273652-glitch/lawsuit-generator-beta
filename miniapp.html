<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>诉状助手 · 小程序首页</title>
  <style>
    :root{--navy:#14283d;--gold:#b78633;--cream:#f6f1e8;--ink:#17202b;--muted:#737b84;--line:#e8e4dc;--green:#2a7a61;--white:#fff}*{box-sizing:border-box}html{background:#e8eaed}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f6;min-height:100vh}.phone{width:100%;min-height:100vh;background:#f7f7f6;padding-bottom:92px}.nav{height:92px;padding:env(safe-area-inset-top) 18px 0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between}.nav-title{font-size:17px;font-weight:700;letter-spacing:.5px}.capsule{width:86px;height:32px;border:1px solid rgba(255,255,255,.35);border-radius:18px;display:flex;align-items:center;justify-content:space-evenly}.capsule i{width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:7px 0 #fff,-7px 0 #fff}.capsule b{width:15px;height:15px;border:2px solid #fff;border-radius:50%}.hero{margin:0;background:var(--navy);color:#fff;padding:14px 20px 38px;position:relative;overflow:hidden}.hero:after{content:"法";position:absolute;right:-12px;bottom:-54px;font-family:serif;font-size:150px;color:rgba(255,255,255,.035)}.eyebrow{font-size:12px;color:#d8bd87;margin-bottom:10px}.hero h1{font-family:"Songti SC","STSong",serif;font-size:29px;line-height:1.35;margin:0 0 12px}.hero p{font-size:13px;color:#c7d0d8;line-height:1.75;margin:0;max-width:320px}.content{padding:0 16px;margin-top:-18px;position:relative;z-index:1}.card{background:#fff;border:1px solid rgba(20,40,61,.06);border-radius:15px;box-shadow:0 8px 24px rgba(20,40,61,.06);padding:18px;margin-bottom:14px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 13px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:11px;color:var(--muted)}.draft{display:none;align-items:center;gap:13px}.draft.show{display:flex}.draft-icon{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--gold);font-size:20px;flex:none}.draft-copy{flex:1;min-width:0}.draft-copy strong{font-size:14px}.draft-copy p{font-size:11px;color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:#a0a7af;font-size:20px}.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.case{border:1px solid var(--line);border-radius:13px;background:#fff;padding:16px 14px;text-align:left;min-height:118px;cursor:pointer;position:relative}.case:active{background:#fbf7ef;border-color:#d3b271}.case-icon{width:34px;height:34px;border-radius:10px;background:var(--cream);display:grid;place-items:center;margin-bottom:12px;font-size:18px}.case b{display:block;font-size:14px;line-height:1.45;margin-bottom:5px}.case small{font-size:10px;color:var(--muted);line-height:1.4}.case .go{position:absolute;right:12px;bottom:12px;color:var(--gold)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}.step-num{width:31px;height:31px;border-radius:50%;margin:0 auto 8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px}.step:nth-child(2) .step-num{background:var(--gold)}.step:nth-child(3) .step-num{background:var(--green)}.step b{display:block;font-size:12px;margin-bottom:3px}.step small{color:var(--muted);font-size:10px}.service{display:flex;align-items:center;justify-content:space-between}.service p{font-size:12px;color:var(--muted);margin:6px 0 0}.service button{border:1px solid #d9dfe5;background:#fff;border-radius:8px;padding:8px 12px;color:var(--navy);font-weight:700;font-size:12px}.risk{font-size:10px;color:#8a734e;line-height:1.7;background:#fbf7ef;border-radius:10px;padding:11px 13px;margin-top:14px}.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.96);border-top:1px solid #e7e8ea;display:grid;grid-template-columns:1fr 1fr;z-index:4}.tab{border:0;background:transparent;color:#9299a1;font-size:11px}.tab span{display:block;font-size:21px;line-height:1.1;margin-bottom:4px}.tab.active{color:var(--navy);font-weight:700}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(20,40,61,.94);color:#fff;border-radius:8px;padding:10px 14px;font-size:12px;transition:.2s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:520px){body{padding:28px 0}.phone{width:430px;min-height:860px;margin:0 auto;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(20,40,61,.18);position:relative}.bottom{position:absolute}.nav{padding-top:0;height:72px}}
  </style>
</head>
<body>
<div class="phone">
  <header class="nav"><span></span><div class="nav-title">诉状助手</div><div class="capsule"><i></i><b></b></div></header>
  <section class="hero"><div class="eyebrow">法律文书模板生成工具</div><h1>把案情讲清楚，<br>生成一份诉状草稿</h1><p>按实际情况回答问题，系统将匹配对应模板并整理赔偿项目。</p></section>
  <main class="content">
    <div class="card draft" id="draftCard" onclick="continueDraft()"><div class="draft-icon">稿</div><div class="draft-copy"><strong>继续上次填写</strong><p id="draftText">已有未完成的案件草稿</p></div><div class="arrow">›</div></div>
    <div class="section-head"><h2>选择案件类型</h2><span>约 5–10 分钟</span></div>
    <div class="case-grid">
      <button class="case" onclick="startCase('a')"><div class="case-icon">工</div><b>工伤保险待遇纠纷</b><small>工作中受伤、职业病及上下班途中事故</small><span class="go">→</span></button>
      <button class="case" onclick="startCase('i')"><div class="case-icon">劳</div><b>提供劳务者受害责任纠纷</b><small>帮工、承揽、装修、装卸等作业受伤</small><span class="go">→</span></button>
      <button class="case" onclick="startCase('b')"><div class="case-icon">车</div><b>机动车交通事故责任纠纷</b><small>机动车、非机动车及行人交通事故</small><span class="go">→</span></button>
      <button class="case" onclick="startCase('d')"><div class="case-icon">民</div><b>生命权、身体权、健康权纠纷</b><small>公共场所、故意伤害及其他侵权致伤</small><span class="go">→</span></button>
    </div>
    <div class="section-head" style="margin-top:22px"><h2>三步生成</h2><span>信息自动保存</span></div>
    <div class="card"><div class="steps"><div class="step"><div class="step-num">1</div><b>选择类型</b><small>确认案件路径</small></div><div class="step"><div class="step-num">2</div><b>填写案情</b><small>只问相关问题</small></div><div class="step"><div class="step-num">3</div><b>生成诉状</b><small>预览并获取 Word</small></div></div></div>
    <div class="card service"><div><strong>填写时遇到问题？</strong><p>可联系工作人员协助操作</p></div><button onclick="showToast('客服功能将在正式版接入')">联系客服</button></div>
    <div class="risk">本工具仅提供法律文书模板生成服务，不构成法律咨询、案件代理或诉讼结果承诺。生成内容仅供参考，提交立案前建议由法律专业人员复核。交付文件为可编辑 Word。</div>
  </main>
  <nav class="bottom"><button class="tab active"><span>⌂</span>首页</button><button class="tab" onclick="openHistory()"><span>▤</span>我的文书</button></nav>
  <div class="toast" id="toast"></div>
</div>
<script src="analytics.js"></script>
<script>
const DRAFT_KEY='lawsuit-0.7beta-draft',HISTORY_KEY='lawsuit-0.7beta-history';
const caseNames={a:'工伤保险待遇纠纷',i:'提供劳务者受害责任纠纷',b:'机动车交通事故责任纠纷',d:'生命权、身体权、健康权纠纷'};
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key)||'null')||fallback}catch{return fallback}}
function renderDraft(){const draft=read(DRAFT_KEY,null);if(!draft||draft.screen==='start')return;document.getElementById('draftCard').classList.add('show');document.getElementById('draftText').textContent=`${caseNames[draft.answers?.A1]||'人身损害案件'} · 已自动保存`}
function startCase(value){localStorage.setItem(DRAFT_KEY,JSON.stringify({screen:'question',answers:{A1:value},path:['A1'],index:0}));AppAnalytics?.track('case_start',{caseType:{a:'work',i:'labor',b:'traffic',d:'assault'}[value],source:'miniapp_home'});location.href='index.html'}
function continueDraft(){location.href='index.html'}
function openHistory(){const list=read(HISTORY_KEY,[]);if(list.length){location.href='index.html'}else showToast('暂时没有历史文书')}
function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
AppAnalytics?.track('miniapp_home_view',{});renderDraft();
</script>
</body>
</html>
